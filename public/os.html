<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rich Aroma | OS Hub</title>
    <link rel="manifest" href="/pos-manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/rico-logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: '#C9A66B', dark: '#120C09' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #120C09; color: white; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px border-white/10; }
        .animate-swing { animation: swing 2s infinite; }
        @keyframes swing {
            0% { transform: rotate(0); }
            10% { transform: rotate(10deg); }
            20% { transform: rotate(-10deg); }
            30% { transform: rotate(5deg); }
            40% { transform: rotate(-5deg); }
            50% { transform: rotate(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-sm text-center space-y-8 animate-in fade-in zoom-in duration-500">
        <!-- Logo -->
        <div class="relative inline-block">
            <div class="w-24 h-24 bg-gold/10 rounded-[2.5rem] flex items-center justify-center mx-auto border border-gold/20 shadow-2xl">
                <img id="brand-logo" src="/rico-logo.png" class="w-16 h-16 object-contain" alt="Logo">
            </div>
            <div class="absolute -bottom-2 -right-2 bg-gold text-dark text-[10px] font-black px-2 py-0.5 rounded-full shadow-lg">OS</div>
        </div>

        <div>
            <h1 id="brand-title" class="text-3xl font-black uppercase tracking-tighter">Rich Aroma</h1>
            <p id="brand-subtitle" class="text-white/40 font-bold text-xs uppercase tracking-widest mt-1">Sistema Operativo Central</p>
        </div>

        <!-- PIN Input Area -->
        <div id="login-section" class="space-y-6">
            <div class="space-y-2">
                <input type="password" id="os-pin" maxlength="4" inputmode="numeric" onkeyup="if(event.key==='Enter') handleOSLogin()" class="w-full bg-transparent border-b-4 border-white/10 text-center text-6xl font-black text-gold outline-none tracking-[0.5em] py-4 transition-all focus:border-gold" placeholder="****">
                <p id="auth-status" class="text-[9px] text-white/20 uppercase font-black tracking-widest">Ingrese su PIN de acceso</p>
            </div>

            <button onclick="handleOSLogin()" id="login-btn" class="w-full bg-gold text-dark py-5 rounded-[2rem] font-black text-xl shadow-xl shadow-gold/20 active:scale-95 transition-all">
                INGRESAR
            </button>
        </div>

        <!-- Hidden Loading State -->
        <div id="loading-section" class="hidden space-y-4">
            <i class="fas fa-circle-notch fa-spin text-3xl text-gold"></i>
            <p class="text-[10px] font-black uppercase tracking-widest text-white/40">Sincronizando Perfil...</p>
        </div>

        <!-- Master Menu Container -->
        <div id="master-menu" class="hidden space-y-4 animate-in fade-in slide-in-from-bottom-8 duration-500 text-left">
            <h2 id="menu-title" class="text-gold font-black uppercase tracking-widest text-xs mb-2 text-center">Panel de Control</h2>
            
            <div class="grid grid-cols-1 gap-3" id="menu-grid">
                <!-- Buttons injected via JS -->
            </div>
            
            <button onclick="logout()" class="w-full py-4 text-white/20 font-black text-[10px] uppercase tracking-widest mt-6">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        async function handleOSLogin() {
            const pin = document.getElementById('os-pin').value;
            if (pin.length !== 4) return;

            const btn = document.getElementById('login-btn');
            const loginSec = document.getElementById('login-section');
            const loadSec = document.getElementById('loading-section');
            const status = document.getElementById('auth-status');

            loginSec.classList.add('hidden');
            loadSec.classList.remove('hidden');

            try {
                const res = await fetch('/api/cash/verify-pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || "PIN Inválido");

                // Save session
                localStorage.setItem('ra_kitchen_emp', JSON.stringify(data.employee));
                localStorage.setItem('ra_staff_pin', pin);

                renderUnifiedMenu(data.employee);

            } catch (err) {
                status.innerText = err.message;
                status.classList.remove('text-white/20');
                status.classList.add('text-red-500');
                loginSec.classList.remove('hidden');
                loadSec.classList.add('hidden');
                document.getElementById('os-pin').value = '';
            }
        }

        function tile(path, icon, color, title, sub, newTab) {
            const click = newTab ? `window.open('${path}', '_blank')` : `window.location.href='${path}'`;
            return `
            <button onclick="${click}" class="glass p-5 rounded-[2rem] w-full flex items-center gap-4 active:scale-95 transition-all">
                <div class="w-12 h-12 bg-${color}/20 rounded-2xl flex items-center justify-center text-${color} border border-${color}/30 shrink-0">
                    <i class="fas ${icon} text-xl"></i>
                </div>
                <div class="text-left">
                    <p class="font-black text-sm uppercase tracking-tight">${title}</p>
                    <p class="text-[9px] text-white/40 font-bold uppercase tracking-widest">${sub}</p>
                </div>
            </button>`;
        }

        function section(label) {
            return `<p class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 mt-4 mb-1 text-center">${label}</p>`;
        }

        function renderUnifiedMenu(emp) {
            const loadSec = document.getElementById('loading-section');
            const masterMenu = document.getElementById('master-menu');
            const grid = document.getElementById('menu-grid');
            const title = document.getElementById('menu-title');

            const role = (emp.role || '').toLowerCase().trim();
            // ROLES (roles build, 2026-10-30): canonical roles, mirror of
            // api/lib/roles.js. The launcher only decides what to SHOW —
            // the API enforces. Owner = the master/owner credential;
            // encargado = admin/manager; barista_cashier runs POS + KDS.
            const isOwner = emp.id === 'master_admin' || emp.id === 'master' || role === 'owner';
            const isEncargado = !isOwner && (role === 'admin' || role === 'manager' || role === 'encargado');
            const isAdmin = isOwner || isEncargado;
            const roleLabel = isOwner ? '👑 Dueño' : isEncargado ? '🛠 Encargado'
                : (role === 'barista_cashier' || role === 'cashier' || role === 'cajero' || role === 'caja') ? '💵 Cajero'
                : '☕ Barista / Cocina';
            const canPOS = isAdmin || role === 'barista_cashier' || role === 'cashier' || role === 'cajero' || role === 'caja';
            const canKDS = isAdmin || canPOS && role === 'barista_cashier' || role === 'barista' || role === 'cook' || role === 'cocinero' || role === 'cocina' || role === 'barista_cook';
            const isMobile = window.innerWidth < 1024;
            const isPartner = !!(emp.restaurant_id && emp.restaurant_id !== 'rich-aroma');
            const rid = emp.restaurant_id || 'rich-aroma';

            // Dynamic tenant branding fetch
            if (isPartner) {
                fetch(`/api/store?action=restaurant_info&id=${emp.restaurant_id}`)
                    .then(res => res.json())
                    .then(info => {
                        if (info) {
                            document.getElementById('brand-title').innerText = info.name;
                            if (info.logo_url) {
                                document.getElementById('brand-logo').src = info.logo_url;
                            }
                            document.getElementById('brand-subtitle').innerText = "Socio QuimiEats OS";
                        }
                    })
                    .catch(e => console.error("Tenant branding load failed:", e));
            }

            loadSec.classList.add('hidden');
            masterMenu.classList.remove('hidden');
            title.innerText = (emp.name ? emp.name + ' · ' : '') + roleLabel;

            let html = '';

            // ===== CONTROL (admins/managers only) =====
            if (isAdmin) {
                html += section('Control');
                if (isPartner) {
                    html += tile('/partner-os', 'fa-chart-line', 'gold', 'Panel del Negocio', 'Ventas, Menú y Horarios');
                } else {
                    html += tile('/owner', 'fa-chart-line', 'gold', 'Owner Dashboard', 'Ventas y Métricas');
                    html += tile('/admin', 'fa-cog', 'gold', 'Administración', 'Empleados, Menú, Inventario y Marketing');
                    if (isOwner) {
                        html += tile('/partner-os', 'fa-gear', 'gold', 'Configuración del Negocio', 'Banco, Horarios y Métodos de Pago');
                        html += tile('/quimieats-admin', 'fa-globe', 'gold', 'QuimiEats Plataforma', 'Socios, Comisiones y Marketplace');
                    }
                }
            }

            // ===== OPERACIÓN =====
            html += section('Operación');
            if (canPOS) {
                const posPath = isPartner ? `/pos-v2.html?restaurantId=${rid}` : '/pos-v2.html';
                html += tile(posPath, 'fa-cash-register', 'blue-400', 'Punto de Venta (POS)', 'Caja y Registro');
            }
            if (canKDS) {
                const hubPath = isPartner ? `/kitchen.html?restaurantId=${rid}` : '/kitchen.html';
                html += tile(hubPath, 'fa-fire-alt', 'orange-400', 'Cocina (KDS)', 'Pedidos en Preparación');
            }
            if (!isPartner && (isAdmin || role.includes('driver') || role.includes('repartidor'))) {
                html += tile('/driver-portal', 'fa-motorcycle', 'green-400', 'Driver Portal', 'Entregas a Domicilio');
            }
            if (!isPartner && isOwner) {
                html += tile('/cali/admin', 'fa-box', 'purple-400', 'Cali Admin', 'Botellas: Pedidos, Producción y Rutas');
                html += tile('/cali/pos', 'fa-mobile', 'purple-400', 'Cali POS', 'Venta Móvil de Botellas');
                html += tile('/timeclock.html', 'fa-clock', 'teal-400', 'Reloj de Personal', 'Entradas y Salidas');
            }
            html += tile('/alerts', 'fa-bell', 'gold', 'Alertas en Vivo', 'Sonido de Pedidos');

            // ===== CANALES (view-only, new tab) =====
            if (isAdmin) {
                html += section('Canales');
                if (!isPartner) {
                    html += tile('/order', 'fa-store', 'pink-400', 'Ver Tienda', 'Página del Cliente — Quimistán', true);
                    html += tile('/cali', 'fa-wine-bottle', 'pink-400', 'Ver Cali', 'Tienda de Botellas — SoCal', true);
                }
                html += tile('/quimieats.html', 'fa-utensils', 'pink-400', 'Ver QuimiEats', 'Marketplace de Quimistán', true);
                if (!isPartner) {
                    html += tile('https://wa.me/50499054412', 'fa-whatsapp', 'green-400', 'WhatsApp del Negocio', '+504 9905-4412', true);
                }
            }

            grid.innerHTML = html;
        }

        function logout() {
            localStorage.removeItem('ra_kitchen_emp');
            localStorage.removeItem('ra_staff_pin');
            location.reload();
        }

        window.onload = () => {
            const savedEmp = localStorage.getItem('ra_kitchen_emp');
            const savedPin = localStorage.getItem('ra_staff_pin');
            if (savedEmp && savedPin) {
                document.getElementById('login-section').classList.add('hidden');
                renderUnifiedMenu(JSON.parse(savedEmp));
            } else {
                document.getElementById('os-pin').focus();
            }
        };
    </script>
    <script src="/quimi-nav.js"></script>
</body>
</html>
