<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reclamar Mi Regalo | QuimiEats 🎁</title>
    <!-- Google Fonts & Tailwind -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

    <!-- Abstract Gradient Blobs -->
    <div class="absolute w-[500px] h-[500px] rounded-full bg-purple-600/10 blur-[120px] top-[-10%] left-[-10%] pointer-events-none"></div>
    <div class="absolute w-[400px] h-[400px] rounded-full bg-gold/10 blur-[100px] bottom-[-10%] right-[-10%] pointer-events-none"></div>

    <div class="w-full max-w-md text-center space-y-8 animate-in fade-in zoom-in duration-500 z-10">
        
        <!-- Animated Gift Box Header -->
        <div class="relative inline-block">
            <div class="w-24 h-24 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-[2.5rem] flex items-center justify-center mx-auto border border-purple-400/30 shadow-2xl animate-bounce">
                <i class="fas fa-gift text-white text-4xl"></i>
            </div>
            <div class="absolute -bottom-2 -right-2 bg-gold text-dark text-[9px] font-black px-2.5 py-1 rounded-full shadow-lg uppercase tracking-wider">Premio</div>
        </div>

        <div>
            <h1 class="text-3xl font-black uppercase tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-300">Regalo UGC</h1>
            <p class="text-white/40 font-bold text-xs uppercase tracking-widest mt-1">Reclama tu recompensa QuimiEats</p>
        </div>

        <!-- AUTH BOX (Login/Register if not logged in) -->
        <div id="auth-box" class="glass p-8 rounded-[2.5rem] space-y-6 hidden">
            <h2 class="text-sm font-black uppercase tracking-widest text-purple-300">Identifícate para Guardar Tu Saldo</h2>
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-[9px] font-black uppercase tracking-widest text-white/40 block mb-1.5 ml-2">Número de Teléfono</label>
                    <input type="tel" id="claim-phone" placeholder="Ej: 99881122" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-white outline-none focus:border-purple-500 transition-all font-bold">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase tracking-widest text-white/40 block mb-1.5 ml-2">Crea tu PIN de Retiro (4 dígitos)</label>
                    <input type="password" id="claim-pin" maxlength="4" placeholder="****" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-center text-xl tracking-[0.5em] text-white outline-none focus:border-purple-500 transition-all font-black">
                </div>
            </div>
            <button onclick="handleAuth()" id="btn-auth" class="w-full bg-gradient-to-r from-purple-500 to-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95 transition-all shadow-lg shadow-purple-500/20">Iniciar y Reclamar 🚀</button>
        </div>

        <!-- CLAIM BOX (Confirms prize) -->
        <div id="claim-box" class="glass p-8 rounded-[2.5rem] space-y-6 hidden">
            <div class="py-4 space-y-2">
                <p id="claim-greeting" class="text-xs text-white/60 font-bold uppercase tracking-wide"></p>
                <h3 id="prize-description" class="text-2xl font-black text-gold">L. 30.00 en Saldo</h3>
                <p id="res-info" class="text-[10px] text-purple-300 font-bold uppercase tracking-widest">Patrocinado por Rich Aroma</p>
            </div>
            <button onclick="executeClaim()" id="btn-claim" class="w-full bg-gold text-dark py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95 transition-all shadow-lg shadow-gold/20">Reclamar Mi Premio 🎁</button>
        </div>

        <!-- SUCCESS SCREEN -->
        <div id="success-box" class="glass p-8 rounded-[2.5rem] space-y-6 hidden">
            <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto text-green-400 border border-green-500/30">
                <i class="fas fa-check text-2xl"></i>
            </div>
            <div>
                <h3 class="text-xl font-black uppercase">¡Reclamado con Éxito!</h3>
                <p id="success-description" class="text-[10px] text-white/50 font-bold uppercase tracking-widest mt-1">El saldo ha sido cargado a tu billetera</p>
            </div>
            <button onclick="window.location.href='/quimieats.html'" class="w-full bg-white text-dark py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95 transition-all">Ir a la Aplicación 🍔</button>
        </div>

        <p id="status-msg" class="text-[10px] text-white/20 uppercase font-black tracking-widest"></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const claimCode = urlParams.get('code');
        let activeCustomer = null;

        let codeInfo = null;

        window.onload = async () => {
            if (!claimCode) {
                showStatus("No se ha proporcionado ningún código de reclamo.");
                return;
            }
            
            showStatus("Verificando código de regalo...", false);
            try {
                const res = await fetch(`/api/store?action=get_ugc_code_info&code=${claimCode}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Código inválido");

                codeInfo = data;
                document.getElementById('status-msg').innerText = "";

                if (codeInfo.is_fully_redeemed) {
                    showStatus("¡Lo sentimos! Este regalo ya alcanzó su límite de reclamos o ganadores. 😔");
                    document.getElementById('auth-box').classList.add('hidden');
                    document.getElementById('claim-box').classList.add('hidden');
                    return;
                }

                // Check login session
                const savedUser = localStorage.getItem('quimi_user');
                if (savedUser) {
                    activeCustomer = JSON.parse(savedUser);
                    showClaimBox();
                } else {
                    document.getElementById('auth-box').classList.remove('hidden');
                }
            } catch (err) {
                showStatus(err.message);
            }
        };

        function showStatus(msg, isError = true) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            if (isError) {
                el.classList.remove('text-white/20');
                el.classList.add('text-red-500');
            } else {
                el.classList.remove('text-red-500');
                el.classList.add('text-white/20');
            }
        }

        function showClaimBox() {
            if (!codeInfo) return;
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('claim-box').classList.remove('hidden');
            document.getElementById('claim-greeting').innerText = `¡Hola, ${activeCustomer.name}! Tienes un regalo de:`;
            document.getElementById('res-info').innerText = `Patrocinado por: ${codeInfo.restaurant_name}`;
            
            // Format prize name dynamically
            let prizeLabel = `L. ${codeInfo.reward_value}.00 en Saldo`;
            if (codeInfo.reward_type === 'gacha_spin') {
                prizeLabel = `¡1 Giro de la Ruleta Gacha! 🎡`;
            } else if (codeInfo.reward_type === 'item') {
                prizeLabel = `¡${codeInfo.reward_item_name || 'Producto'} Gratis! 🎁`;
            }
            
            // Display remaining claims count badge if max_claims > 1
            if (codeInfo.max_claims > 1) {
                const remaining = codeInfo.max_claims - codeInfo.claims_count;
                prizeLabel += `<span class="block text-[10px] font-black uppercase text-purple-400 mt-2">Quedan ${remaining} de ${codeInfo.max_claims} disponibles</span>`;
            }
            
            document.getElementById('prize-description').innerHTML = prizeLabel;
        }

        async function handleAuth() {
            const phone = document.getElementById('claim-phone').value.trim();
            const pin = document.getElementById('claim-pin').value;
            const btn = document.getElementById('btn-auth');

            if (!phone || !pin) return alert("Por favor ingresa tu número y pin");

            btn.innerText = "Registrando..."; btn.disabled = true;

            try {
                // Check if account exists, otherwise create it (Instant self-serve signup!)
                let res = await fetch('/api/store?action=customer_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, pin })
                });

                let data = await res.json();
                
                if (res.status === 404) {
                    // Sign up new user instantly!
                    const name = prompt("¡Es tu primera vez en QuimiEats! ¿Cuál es tu nombre?");
                    if (!name) throw new Error("Nombre requerido para el registro.");
                    
                    const signupRes = await fetch('/api/store?action=customer_create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone, pin, name })
                    });
                    
                    const signupData = await signupRes.json();
                    if (!signupRes.ok) throw new Error(signupData.error || "Registro fallido");
                    
                    data = { user: signupData.customer };
                } else if (!res.ok) {
                    throw new Error(data.error || "PIN incorrecto");
                }

                activeCustomer = data.user;
                localStorage.setItem('quimi_user', JSON.stringify(activeCustomer));
                showClaimBox();

            } catch (e) {
                alert(e.message);
            } finally {
                btn.innerText = "Iniciar y Reclamar 🚀"; btn.disabled = false;
            }
        }

        async function executeClaim() {
            if (!activeCustomer || !claimCode) return;
            const btn = document.getElementById('btn-claim');
            btn.innerText = "Procesando..."; btn.disabled = true;

            try {
                const res = await fetch('/api/store?action=claim_ugc_code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: claimCode,
                        customerId: activeCustomer.id
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Error al reclamar");

                // Trigger confetti!
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                document.getElementById('claim-box').classList.add('hidden');
                document.getElementById('success-box').classList.remove('hidden');

                // Sync local points wallet if it's points or spin
                if (data.reward_type === 'points' || data.reward_type === 'gacha_spin') {
                    const updatedPoints = (activeCustomer.points || 0) + (parseInt(data.reward_value) || 0);
                    activeCustomer.points = updatedPoints;
                    localStorage.setItem('quimi_user', JSON.stringify(activeCustomer));
                    document.getElementById('success-description').innerText = "El saldo ha sido cargado a tu billetera";
                } else if (data.reward_type === 'item') {
                    document.getElementById('success-description').innerText = "Tu cupón de producto gratis ha sido guardado en tu cuenta (Mi Cuenta)";
                }

            } catch(e) {
                alert(e.message);
                btn.innerText = "Reclamar Mi Premio 🎁"; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
