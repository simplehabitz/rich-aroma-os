<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rich Aroma | Kitchen Mobile v2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: '#C9A66B', dark: '#120C09', charcoal: '#1E1610', success: '#10B981', error: '#EF4444' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap');
        body { background-color: #120C09; color: #F5F5F0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        #main-content.locked { filter: blur(20px); pointer-events: none; }
        
        /* ITEM STATES */
        .state-pending { border-left: 4px solid #444; }
        .state-preparing { border-left: 4px solid #C9A66B; background: rgba(201, 166, 107, 0.05); }
        .state-ready { border-left: 4px solid #10B981; opacity: 0.4; }
        .item-ready-text { text-decoration: line-through; color: rgba(255,255,255,0.2); }
        
        .order-card { transition: all 0.3s ease; }
        .timer-urgent { color: #EF4444; font-weight: 900; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
    <style>
        /* PHONE MODE — the power-outage fallback (requirement, Oct 24):
           the board is already a single scrolling column; below 640px
           the header controls wrap onto a second clean row instead of
           overflowing, and the station toggle slims down. */
        @media (max-width: 640px) {
            #main-content > header { flex-wrap: wrap; row-gap: 0.5rem; }
            #btn-drinks, #btn-food { padding-left: 0.8rem !important; padding-right: 0.8rem !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- LOGIN OVERLAY -->
    <div id="login-modal" class="fixed inset-0 bg-dark/95 z-[500] flex flex-col items-center justify-center p-8 text-center backdrop-blur-xl">
        <div class="w-24 h-24 bg-gold/10 text-gold rounded-[2.5rem] flex items-center justify-center text-4xl mb-6 shadow-2xl border border-gold/20 animate-bounce-in"><i class="fas fa-fire-alt"></i></div>
        <h2 class="text-3xl font-display font-bold text-white mb-2 uppercase tracking-tighter">Acceso de Cocina</h2>
        <p class="text-white/40 text-sm mb-8">Ingresa tu PIN de empleado</p>
        <input type="password" id="login-pin" maxlength="4" inputmode="numeric" onkeyup="if(event.key==='Enter') handleLogin()" class="w-full max-w-xs bg-transparent border-b-4 border-white/10 text-center text-6xl font-black text-gold outline-none tracking-[0.5em] py-4 mb-8" placeholder="****">
        <button onclick="handleLogin()" id="login-btn" class="w-full max-w-xs bg-gold text-dark py-5 rounded-[2rem] font-black text-xl shadow-xl active:scale-95 transition-all">INGRESAR</button>
    </div>

    <div id="main-content" class="locked flex-1 flex flex-col">
        <!-- Production Summary Bar -->
        <div class="bg-gold text-dark px-6 py-3 flex gap-6 overflow-x-auto hide-scrollbar border-b border-gold/20 z-50 sticky top-0 shadow-lg">
            <p class="text-[10px] font-black uppercase tracking-widest shrink-0 flex items-center gap-2"><i class="fas fa-layer-group"></i> Total Pendiente:</p>
            <div id="prod-summary" class="flex gap-4 text-[11px] font-black whitespace-nowrap"></div>
        </div>

        <header class="bg-dark/95 backdrop-blur-md p-4 flex justify-between items-center border-b border-white/5 shadow-2xl shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='/os'" class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-white/40 hover:bg-white/10 transition-all"><i class="fas fa-home"></i></button>
                <div>
                    <h1 class="text-sm font-black tracking-widest uppercase text-white/90">Kitchen Mobile</h1>
                    <p id="sync-status" class="text-[8px] text-white/30 font-bold uppercase tracking-widest">Sincronizando...</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <div class="flex bg-white/5 rounded-full p-1 border border-white/10">
                    <button onclick="setMode('drinks')" id="btn-drinks" class="px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all bg-gold text-dark">Barista</button>
                    <button onclick="setMode('food')" id="btn-food" class="px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all text-white/40">Cocina</button>
                </div>
                <button onclick="toggleRecientes()" class="px-4 py-2 rounded-full bg-white/5 border border-white/10 text-[10px] font-black uppercase text-white/60 active:scale-95 transition-all">Recientes <span id="recientes-count" class="text-emerald-400"></span></button>
                <button onclick="logout()" class="text-white/20 text-lg p-2 ml-1"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <section id="recientes-panel" class="hidden bg-black/40 border-b border-emerald-500/20 px-4 py-3 space-y-2 shrink-0 max-h-64 overflow-y-auto"></section>

        <main class="flex-1 p-4 space-y-6 pb-32 overflow-y-auto" id="kds-container"></main>
    </div>

    <!-- Audio Chimes -->
    <audio id="chime-new" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- BUILD CARD OVERLAY (receta por ticket: pasos + ingredientes con
         los modificadores YA aplicados a las cantidades) -->
    <div id="build-card-overlay" class="hidden fixed inset-0 z-[600] bg-dark/95 backdrop-blur-xl overflow-y-auto p-4" onclick="if(event.target===this) closeBuildCard()">
        <div class="bg-charcoal w-full max-w-lg rounded-[2rem] border border-white/10 shadow-2xl my-6 mx-auto">
            <div class="p-5 border-b border-white/5 flex justify-between items-center">
                <h3 id="build-card-title" class="text-lg font-black uppercase">Receta</h3>
                <button onclick="closeBuildCard()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-white/40 shrink-0"><i class="fas fa-times"></i></button>
            </div>
            <div id="build-card-body" class="p-5"></div>
        </div>
    </div>

    <script>
        let orders = [];
        function escHtml(v) {
            if (v === null || v === undefined) return '';
            return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        let lastOrderCount = 0;
        let currentMode = 'drinks';
        let currentEmployee = null;
        let restaurantInfo = null; // New: Store restaurant info
        const urlParams = new URLSearchParams(window.location.search);
        let currentResId = urlParams.get('restaurantId');
        if (!currentResId) {
            try {
                const savedEmp = localStorage.getItem('ra_kitchen_emp');
                if (savedEmp) {
                    const parsed = JSON.parse(savedEmp);
                    if (parsed && parsed.restaurant_id) {
                        currentResId = parsed.restaurant_id;
                    }
                }
            } catch(e) {}
        }
        if (!currentResId) currentResId = 'rich-aroma';

        window.onload = () => {
            fetchRestaurantInfo(); // Fetch info on load
            const savedPin = localStorage.getItem('ra_staff_pin');
            if (savedPin) { document.getElementById('login-pin').value = savedPin; handleLogin(); }
            else { document.getElementById('login-pin').focus(); }
        };

        async function fetchRestaurantInfo() {
            try {
                const res = await fetch(`/api/store?action=restaurant_info&id=${currentResId}`);
                if (res.ok) {
                    restaurantInfo = await res.json();
                    adaptUIForCategory();
                }
            } catch (e) { console.error("Res info failed", e); }
        }

        function adaptUIForCategory() {
            if (!restaurantInfo) return;
            
            // Update Title
            const title = document.querySelector('h1');
            if (title) title.innerText = restaurantInfo.name + ' Hub';
            
            // Update Tab Labels for non-food
            const cat = (restaurantInfo.category || '').toLowerCase();
            const btnDrinks = document.getElementById('btn-drinks');
            const btnFood = document.getElementById('btn-food');

            if (['farmacia', 'ferreteria', 'supermercado', 'servicios'].includes(cat)) {
                if (btnDrinks) btnDrinks.innerText = 'Despacho';
                if (btnFood) btnFood.innerText = 'Stock / Almacén';
            }
        }

        // SEC-FIX 1: order writes (status changes, transfer approvals) are
        // staff-gated server-side — the KDS must send the PIN it logged in
        // with as a Bearer credential. Kept in sessionStorage (tab-scoped),
        // falling back to the shared ra_staff_pin the launcher/POS stores.
        let sessionPin = '';
        try { sessionPin = sessionStorage.getItem('ra_kds_pin') || localStorage.getItem('ra_staff_pin') || ''; } catch(e) {}
        function staffHeaders() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + sessionPin }; }
        function relogin() {
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('main-content').classList.add('locked');
        }

        async function handleLogin() {
            const pin = document.getElementById('login-pin').value;
            if (pin.length !== 4) return;
            try {
                const res = await fetch('/api/cash/verify-pin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                sessionPin = pin;
                try { sessionStorage.setItem('ra_kds_pin', pin); } catch(e) {}
                currentEmployee = data.employee;
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('main-content').classList.remove('locked');
                startSync();
            } catch (e) { alert(e.message); document.getElementById('login-pin').value = ''; }
        }

        function startSync() {
            fetchOrders();
            setInterval(fetchOrders, 4000);
        }

        async function fetchOrders() {
            try {
                const res = await fetch(`/api/orders?restaurantId=${currentResId}&v=` + Date.now());
                const data = await res.json();
                const newOrders = data.orders || [];

                // Sound Alert Logic
                if (newOrders.length > lastOrderCount && lastOrderCount !== 0) {
                    const chime = document.getElementById('chime-new');
                    if (chime) {
                        chime.currentTime = 0;
                        chime.play().catch(e => console.log("Sound blocked by browser interaction rules"));
                    }
                }
                lastOrderCount = newOrders.length;

                orders = newOrders;
                renderKDS();
                renderProductionSummary();
                renderRecientes();
                document.getElementById('sync-status').innerText = 'Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
            } catch (e) { console.error(e); }
        }
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-drinks').className = mode === 'drinks' ? "px-5 py-2 rounded-full text-[10px] font-black uppercase bg-gold text-dark" : "px-5 py-2 rounded-full text-[10px] font-black uppercase text-white/40";
            document.getElementById('btn-food').className = mode === 'food' ? "px-5 py-2 rounded-full text-[10px] font-black uppercase bg-gold text-dark" : "px-5 py-2 rounded-full text-[10px] font-black uppercase text-white/40";
            renderKDS();
        }

        // Station classification: the item's menu CATEGORY is the source of truth
        // (orders carry it from menu_items). Keyword checks remain only as a
        // fallback for legacy items without a category. An item that matches
        // NEITHER station is shown on BOTH (itemMatchesMode) — nothing on the
        // menu may ever be invisible to the kitchen. (Bug found 2026-10-24:
        // the old keyword-only rules hid 21 of 32 menu items, incl. Americano.)
        const DRINK_CATS = ['espresso_bar', 'tea_matcha', 'supremes_icees', 'bebidas', 'drinks'];
        const FOOD_CATS = ['grill_toast_crepes', 'bakery', 'bowls_salads', 'food', 'comida', 'reposteria'];

        function isDrinkItem(i) {
            const cat = (i.category || '').toLowerCase();
            if (FOOD_CATS.includes(cat)) return false;
            if (DRINK_CATS.includes(cat)) return true;
            const name = (i.name || '').toLowerCase();
            const id = (i.id || '').toLowerCase();
            if (name.includes('dubai')) return false;
            return id.startsWith('hot_') || id.startsWith('cold_') || id.startsWith('frappe_') || name.includes('latte') || name.includes('brew') || name.includes('capp') || name.includes('frappe') || name.includes('smoothie') || name.includes('tea') || name.includes('combo') || name.includes('americano') || name.includes('espresso') || name.includes('mocha') || name.includes('icee') || name.includes('limonada') || name.includes('lemonade');
        }

        function isFoodItem(i) {
            const cat = (i.category || '').toLowerCase();
            if (DRINK_CATS.includes(cat)) return false;
            if (FOOD_CATS.includes(cat)) return true;
            const name = (i.name || '').toLowerCase();
            const id = (i.id || '').toLowerCase();
            return id.startsWith('food_') || name.includes('baleada') || name.includes('crepa') || name.includes('sandwich') || name.includes('toast') || name.includes('combo') || name.includes('burrito') || name.includes('bowl') || name.includes('ensalada') || name.includes('salad') || name.includes('cheesecake') || name.includes('cookie') || name.includes('flan') || name.includes('muffin');
        }

        function itemMatchesMode(i) {
            const d = isDrinkItem(i);
            const f = isFoodItem(i);
            if (!d && !f) return true; // unclassified: visible on both stations, never hidden
            return currentMode === 'drinks' ? d : f;
        }

        function renderProductionSummary() {
            const summary = {};
            const parseDate = (dateStr) => {
                if (!dateStr) return new Date();
                let fixedStr = dateStr.replace(' ', 'T');
                if (!fixedStr.includes('Z') && !fixedStr.includes('+')) fixedStr += 'Z';
                return new Date(fixedStr);
            };

            orders.filter(o => {
                if (!['pending', 'paid', 'preparing', 'drinks_ready', 'food_ready'].includes(o.status)) return false;
                
                // Scheduling Filter for Summary
                if (o.scheduled_for) {
                    const schedTime = parseDate(o.scheduled_for);
                    const now = new Date();
                    const isInPrep = o.status === 'preparing' || (o.items && o.items.some(i => i.status === 'preparing'));
                    if (!isInPrep && (schedTime - now > 10 * 60000)) return false;
                    if (schedTime.getFullYear() > 2050) return false;
                }
                return true;
            }).forEach(o => {
                (o.items || []).forEach(i => {
                    if (i.status === 'ready') return;
                    if (!itemMatchesMode(i)) return;
                    summary[i.name] = (summary[i.name] || 0) + (i.qty || 1);
                });
            });
            document.getElementById('prod-summary').innerHTML = Object.entries(summary).map(([name, qty]) => `
                <div class="flex items-center gap-1">
                    <span class="bg-dark/20 px-1.5 py-0.5 rounded">${qty}</span>
                    <span class="uppercase">${escHtml(name)}</span>
                </div>
            `).join('<span class="opacity-10">/</span>');
        }

        // --- TWO-STATION HALVES (kitchen communication) ---
        // Every ticket is two halves: Bebidas (Barista) and Comida (Cocina).
        // Half states derive from ITEM states + the station classifiers —
        // never from the stored order status — so both screens always show
        // the truth, including which half is holding the ticket up.
        // Completing MY half writes the model's per-station status
        // (drinks_ready / food_ready); the order becomes 'ready' only when
        // BOTH halves that exist are ready. Before this, the LISTO button
        // completed the WHOLE order from either station's screen.
        function itemInDrinks(i) { const d = isDrinkItem(i), f = isFoodItem(i); return d || !f; }
        function itemInFood(i) { const d = isDrinkItem(i), f = isFoodItem(i); return f || !d; }
        // COMBO SPLIT: a combo product is ONE line that classifies to BOTH
        // stations — its drink lives in its Bebida/Leche/etc. modifiers,
        // its food is the base item. Each station owns a PART of the line,
        // tracked on the line itself (i.stations), and the line is only
        // 'ready' when both parts check in. Before this, the line's single
        // status let the first station to finish complete both parts.
        const DRINK_MOD_GROUPS = ['Bebida', 'Leche', 'Dulzor', 'Temperatura', 'Sabor'];
        function isSplitCombo(i) { return isDrinkItem(i) && isFoodItem(i); }
        function modSide(m) {
            if (!m || !m.group) return 'both'; // legacy name-only mods: never hide information from a station
            return DRINK_MOD_GROUPS.includes(m.group) ? 'drinks' : 'food';
        }
        function partStatus(i, mode) {
            if (!isSplitCombo(i)) return i.status || null;
            return (i.stations || {})[mode] || null;
        }
        function comboLineStatus(i) {
            const d = (i.stations || {}).drinks, f = (i.stations || {}).food;
            if (d === 'ready' && f === 'ready') return 'ready';
            if (d || f) return 'preparing';
            return null;
        }
        function halfState(o, mode) {
            const items = (o.items || []).filter(i => mode === 'drinks' ? itemInDrinks(i) : itemInFood(i));
            if (!items.length) return 'none';
            if (items.every(i => partStatus(i, mode) === 'ready')) return 'ready';
            if (items.some(i => partStatus(i, mode) === 'ready' || partStatus(i, mode) === 'preparing')) return 'working';
            return 'pending';
        }
        function orderHalves(o) { return { drinks: halfState(o, 'drinks'), food: halfState(o, 'food') }; }
        function halvesStrip(o) {
            const h = orderHalves(o);
            if (h.drinks === 'none' || h.food === 'none') return '';
            const pill = (icon, label, st) => {
                const word = st === 'ready' ? 'Lista ✓' : (st === 'working' ? 'Preparando' : 'Pendiente');
                const cls = st === 'ready' ? 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10' : (st === 'working' ? 'text-gold border-gold/30 bg-gold/10' : 'text-white/30 border-white/10');
                return `<span class="px-3 py-1.5 rounded-full border text-[9px] font-black uppercase tracking-widest ${cls}"><i class="fas ${icon}"></i> ${label}: ${word}</span>`;
            };
            return `<div class="flex gap-2 flex-wrap">${pill('fa-coffee', 'Bebidas', h.drinks)}${pill('fa-utensils', 'Comida', h.food)}</div>`;
        }
        window.completeMyHalf = async function(id) {
            const o = orders.find(x => String(x.id) === String(id));
            if (!o) return;
            const mine = currentMode;
            const items = (o.items || []).map(i => {
                const inMine = mine === 'drinks' ? itemInDrinks(i) : itemInFood(i);
                if (!inMine) return i;
                if (isSplitCombo(i)) {
                    const merged = { ...i, stations: { ...(i.stations || {}), [mine]: 'ready' } };
                    return { ...merged, status: comboLineStatus(merged) };
                }
                return i.status !== 'ready' ? { ...i, status: 'ready' } : i;
            });
            const h = orderHalves({ ...o, items });
            const other = mine === 'drinks' ? h.food : h.drinks;
            const status = (other === 'ready' || other === 'none') ? 'ready' : (mine === 'drinks' ? 'drinks_ready' : 'food_ready');
            try {
                const res = await fetch('/api/orders/' + id, { method: 'PATCH', headers: staffHeaders(), body: JSON.stringify({ status, items }) });
                if (res.status === 401) { alert("Sesión expirada. Ingresa tu PIN de nuevo."); relogin(); return; }
                fetchOrders();
            } catch (e) { alert("Error"); }
        };

        // MOD-STANDARD: modifiers print grouped by their group label, in
        // the order they were chosen (conversation order), each option
        // named as the kitchen reads it. Removals ("Sin …") print loud —
        // a quiet removal is a remake. Old name-only mods still render.
        function modsHtml(item, mode) {
            let mods = (item && item.mods) || [];
            // Split combo: each station sees only its own part's modifiers
            // (plus any legacy ungrouped ones — never hide information).
            if (mode && isSplitCombo(item)) mods = mods.filter(m => { const s = modSide(m); return s === mode || s === 'both'; });
            if (!mods.length) return '';
            const lines = [];
            let cur = null;
            mods.forEach(m => {
                const g = (m && m.group) || '';
                if (!cur || cur.g !== g) { cur = { g, parts: [] }; lines.push(cur); }
                const name = (m && m.name) || '';
                const label = name + (m && m.qty ? ' ×' + m.qty : '');
                cur.parts.push({ label, sin: /^sin\b/i.test(name) });
            });
            return lines.map(L => `<p class="text-[10px] font-bold uppercase mt-0.5 text-white/40">${L.g ? `<span class="text-white/30">${escHtml(L.g)}:</span> ` : ''}${L.parts.map(p => `<span class="${p.sin ? 'text-red-400 font-black' : ''}">${escHtml(p.label)}</span>`).join(', ')}</p>`).join('');
        }

        // Per-line station pills for split combos: each screen sees its own
        // part's state AND the other station's, on the line itself (the
        // order-level halves strip only aggregates the whole ticket).
        function comboPartsHtml(i) {
            if (!isSplitCombo(i)) return '';
            const word = (m) => { const s = (i.stations || {})[m]; return s === 'ready' ? 'Lista ✓' : (s === 'preparing' ? 'Preparando' : 'Pendiente'); };
            const cls = (m) => { const s = (i.stations || {})[m]; return s === 'ready' ? 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10' : (s === 'preparing' ? 'text-gold border-gold/30 bg-gold/10' : 'text-white/30 border-white/10'); };
            return `<div class="flex gap-1.5 flex-wrap mt-1"><span class="px-2 py-1 rounded-full border text-[8px] font-black uppercase tracking-widest ${cls('drinks')}"><i class="fas fa-coffee"></i> Bebida: ${word('drinks')}</span><span class="px-2 py-1 rounded-full border text-[8px] font-black uppercase tracking-widest ${cls('food')}"><i class="fas fa-utensils"></i> Comida: ${word('food')}</span></div>`;
        }

        function renderKDS() {
            const container = document.getElementById('kds-container');
            
            // Shared date parser
            const parseDate = (dateStr) => {
                if (!dateStr) return new Date();
                let fixedStr = dateStr.replace(' ', 'T');
                if (!fixedStr.includes('Z') && !fixedStr.includes('+')) fixedStr += 'Z';
                return new Date(fixedStr);
            };

            const activeOrders = orders.filter(o => {
                if (['completed', 'cancelled'].includes(o.status)) return false;

                // --- SCHEDULING FILTER ---
                if (o.scheduled_for) {
                    const schedTime = parseDate(o.scheduled_for);
                    const now = new Date();
                    const isInPrep = o.status === 'preparing' || (o.items && o.items.some(i => i.status === 'preparing'));
                    // Hide if more than 10 mins away AND not in prep
                    if (!isInPrep && (schedTime - now > 10 * 60000)) return false;
                    // Hide "Hold" orders (year 2099)
                    if (schedTime.getFullYear() > 2050) return false;
                }

                if (o.status === 'ready') {
                    const readyTime = parseDate(o.completed_at || o.created_at);
                    return (new Date() - readyTime) < (5 * 60000);
                }
                return true;
            }).sort((a, b) => {
                // Tickets whose MY half is done (waiting on the other
                // station) sink below tickets that still need my work.
                const waitA = orderHalves(a)[currentMode] === 'ready' ? 1 : 0;
                const waitB = orderHalves(b)[currentMode] === 'ready' ? 1 : 0;
                if (waitA !== waitB) return waitA - waitB;
                // Sort by scheduled time first, then created_at
                const timeA = oA => parseDate(oA.scheduled_for || oA.created_at);
                return timeA(a) - timeA(b);
            });
            
            if (activeOrders.length === 0) {
                container.innerHTML = '<div class="py-20 text-center text-white/10 uppercase font-black tracking-widest">Cero Pedidos Activos</div>';
                return;
            }

            container.innerHTML = activeOrders.map(o => {
                const items = (o.items || []).filter(i => {
                    if (!itemMatchesMode(i)) return false;
                    // If it's an old item and not an addon, it's already done
                    if (i.is_old && !i.is_addon) return false;
                    return true;
                });
                if (items.length === 0) return '';

                const halves = orderHalves(o);
                const myHalf = currentMode === 'drinks' ? halves.drinks : halves.food;
                const otherHalf = currentMode === 'drinks' ? halves.food : halves.drinks;
                const isMixed = halves.drinks !== 'none' && halves.food !== 'none';
                const waitingOther = myHalf === 'ready' && otherHalf !== 'ready' && otherHalf !== 'none';

                const orderTime = parseDate(o.created_at);
                const schedTime = o.scheduled_for ? parseDate(o.scheduled_for) : null;
                const now = new Date();
                const diffMs = now - orderTime;
                const elapsed = Math.max(0, Math.floor(diffMs / 60000));
                const isUrgent = elapsed > 10;
                
                let timeDisplay = `<p class="text-[10px] font-black uppercase tracking-widest ${isUrgent ? 'timer-urgent' : 'text-success'}">${elapsed} min</p>`;
                if (schedTime && schedTime.getFullYear() < 2050) {
                    const timeStr = schedTime.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
                    timeDisplay = `<p class="text-[10px] font-black text-blue-400 uppercase tracking-widest animate-pulse"><i class="fas fa-clock"></i> ${timeStr}</p>`;
                }

                const groupMatch = o.notes ? o.notes.match(/\[GROUP:\s*([^\]]+)\]/) : null;
                const groupCode = groupMatch ? groupMatch[1] : null;

                return `
                <div onclick="cardBodyClick(event, '${o.id}')" class="bg-charcoal border ${schedTime ? 'border-blue-500/40' : 'border-white/5'} rounded-[2.5rem] p-6 space-y-5 shadow-2xl order-card ${o.status === 'ready' ? 'opacity-50 grayscale' : (waitingOther ? 'opacity-60' : '')}">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-3">
                            <span class="${groupCode ? 'bg-orange-500' : 'bg-gold'} text-dark w-12 h-12 rounded-2xl flex items-center justify-center font-black text-xl shadow-lg shadow-gold/20">#${o.order_number || '---'}</span>
                            <div>
                                <h2 class="font-black text-base uppercase leading-none">${escHtml(o.customers?.name || o.notes?.match(/Mobile:\s*([^\(]+)/)?.[1] || 'Invitado')}</h2>
                                <div class="flex gap-2 mt-1">
                                    <p class="text-[9px] font-bold text-white/30 uppercase tracking-widest">${escHtml(o.fulfillment_type || 'Aquí')}</p>
                                    ${groupCode ? `<span class="text-[9px] font-black text-orange-500 uppercase tracking-widest">[GRUPO: ${escHtml(groupCode)}]</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            ${timeDisplay}
                            <p class="text-[8px] font-bold text-white/20 uppercase mt-0.5">${escHtml(o.status)}</p>
                        </div>
                    </div>

                    ${halvesStrip(o)}

                    <div class="space-y-2">
                        ${o.items.map((i, idx) => {
                            if (!itemMatchesMode(i)) return '';
                            
                            // Optimization: Hide already prepared items in kitchen view to focus on new work
                            if (i.is_old && !i.is_addon) return '';

                            const split = isSplitCombo(i);
                            const effStatus = split ? ((i.stations || {})[currentMode] || null) : i.status;
                            const isReady = effStatus === 'ready';
                            const isPreparing = effStatus === 'preparing';
                            const stateClass = isReady ? 'state-ready' : (isPreparing ? 'state-preparing' : 'state-pending');

                            return `
                            <div onclick="cycleItemState('${o.id}', ${idx}, '${(effStatus || '').replace(/['\\]/g, '')}')" class="p-4 rounded-2xl bg-white/5 border border-white/5 flex items-center justify-between gap-4 active:scale-95 transition-all cursor-pointer ${stateClass}">
                                <div class="flex-1">
                                    <p class="font-black text-sm uppercase ${isReady ? 'item-ready-text' : 'text-white/90'}">${i.qty}x ${escHtml(i.name)}</p>
                                    ${modsHtml(i, currentMode)}
                                    ${comboPartsHtml(i)}
                                    ${i.note ? `<p class="text-[10px] font-black text-blue-400 uppercase mt-1 italic"><i class="fas fa-comment-dots mr-1"></i> ${escHtml(i.note)}</p>` : ''}
                                </div>
                                <div class="w-8 h-8 rounded-full flex items-center justify-center border-2 ${isReady ? 'bg-success border-success text-dark' : (isPreparing ? 'border-gold text-gold' : 'border-white/10 text-white/10')}">
                                    <i class="fas ${isReady ? 'fa-check' : (isPreparing ? 'fa-fire-alt' : 'fa-clock')}"></i>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>

                    <p class="text-center text-[9px] font-black uppercase tracking-widest text-white/20"><i class="fas fa-book-open mr-1"></i> Tocá la tarjeta para ver la receta</p>

                    ${o.notes && o.notes.includes('[DIRECCIÓN:') ? `
                        <div class="p-4 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-blue-400">
                            <p class="text-[8px] font-black uppercase tracking-widest mb-1 opacity-60">Dirección de Entrega</p>
                            <p class="text-xs font-bold leading-snug">${escHtml(o.notes.match(/\[DIRECCIÓN:\s*([^\]]+)\]/)?.[1] || 'Ver POS')}</p>
                        </div>
                    ` : ''}

                    <div class="flex flex-col gap-2">
                        ${o.status === 'pending_verification' ? `
                            <button onclick="openTransferVerify('${o.id}')" class="w-full py-4 bg-amber-500 text-dark font-black rounded-2xl text-xs uppercase tracking-widest shadow-lg animate-pulse">VERIFICAR PAGO</button>
                        ` : ''}
                        ${waitingOther ? `
                            <div class="flex-1 py-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-black text-xs uppercase tracking-widest text-center">✓ ${currentMode === 'drinks' ? 'Bebidas' : 'Comida'} lista — esperando ${currentMode === 'drinks' ? 'comida' : 'bebidas'}</div>
                        ` : `
                            <button onclick="completeMyHalf('${o.id}')" class="flex-1 py-4 bg-success text-dark font-black rounded-2xl text-xs uppercase tracking-widest shadow-lg active:scale-95 transition-all">${isMixed ? (currentMode === 'drinks' ? 'LISTO: BEBIDAS' : 'LISTO: COMIDA') : 'LISTO PARA ENTREGA'}</button>
                        `}
                    </div>
                </div>`;
            }).join('');
        }

        // --- TRANSFER VERIFICATION MODAL ---
        window.openTransferVerify = async function(id) {
            try {
                const res = await fetch(`/api/store?action=order&id=${id}`);
                const order = await res.json();
                const receiptUrl = extractReceiptUrl(order.notes);
                
                if (!receiptUrl) return alert("No se encontró comprobante.");

                const modal = document.createElement('div');
                modal.id = "verify-modal";
                modal.className = "fixed inset-0 z-[1000] bg-dark/95 flex items-center justify-center p-6 backdrop-blur-xl";
                modal.innerHTML = `
                    <div class="bg-charcoal w-full max-w-lg rounded-[3rem] border border-white/10 overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="p-8 border-b border-white/5 flex justify-between items-center">
                            <h3 class="text-xl font-black uppercase">Verificar Transferencia</h3>
                            <button onclick="closeVerify()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-white/40"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center bg-black/40">
                            <img src="${escHtml(receiptUrl)}" class="max-w-full rounded-2xl shadow-2xl">
                        </div>
                        <div class="p-8 border-t border-white/5 grid grid-cols-2 gap-4">
                            <button onclick="processTransfer('${id}', 'rejected')" class="py-5 bg-red-500/10 text-red-500 font-black rounded-2xl text-[10px] uppercase tracking-widest">Rechazar</button>
                            <button onclick="processTransfer('${id}', 'paid')" class="py-5 bg-success text-dark font-black rounded-2xl text-[10px] uppercase tracking-widest">Aprobar Pago</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            } catch(e) { console.error(e); }
        };

        window.closeVerify = () => document.getElementById('verify-modal')?.remove();

        window.processTransfer = async function(id, status) {
            if(!confirm(`¿Deseas ${status === 'paid' ? 'APROBAR' : 'RECHAZAR'} este pago?`)) return;
            try {
                const res = await fetch(`/api/orders/${id}`, {
                    method: 'PATCH',
                    headers: staffHeaders(),
                    body: JSON.stringify({ status })
                });
                if (res.status === 401) { alert("Sesión expirada. Ingresa tu PIN de nuevo."); relogin(); return; }
                closeVerify();
                fetchOrders();
            } catch(e) { alert("Error"); }
        };

        function extractReceiptUrl(notes) {
            const match = (notes || '').match(/\[RECEIPT_URL:(https?:\/\/[^\]]+)\]/);
            return match ? match[1] : null;
        }

        async function cycleItemState(orderId, itemIdx, currentStatus) {
            let nextStatus = 'preparing';
            if (currentStatus === 'preparing') nextStatus = 'ready';
            if (currentStatus === 'ready') nextStatus = null;
            const o = orders.find(x => String(x.id) === String(orderId));
            const tapped = o && (o.items || [])[itemIdx];
            if (tapped && isSplitCombo(tapped)) {
                // Split combo: the tap cycles only MY station's part, and
                // the line status follows both parts. Written via
                // order_update — toggle_item_ready only knows the single
                // line status. Like all item taps, this never changes the
                // ORDER status; only LISTO does.
                const items = (o.items || []).map((it, ix) => {
                    if (ix !== itemIdx) return it;
                    const stations = { ...(it.stations || {}) };
                    if (nextStatus) stations[currentMode] = nextStatus; else delete stations[currentMode];
                    const merged = { ...it, stations };
                    return { ...merged, status: comboLineStatus(merged) };
                });
                try {
                    const res = await fetch('/api/orders/' + orderId, { method: 'PATCH', headers: staffHeaders(), body: JSON.stringify({ items }) });
                    if (res.status === 401) { alert("Sesión expirada. Ingresa tu PIN de nuevo."); relogin(); return; }
                } catch (e) { alert("Error"); return; }
                fetchOrders();
                return;
            }
            await fetch('/api/store?action=toggle_item_ready', { method: 'PATCH', headers: staffHeaders(), body: JSON.stringify({ orderId, itemIdx, status: nextStatus }) });
            fetchOrders();
        }

        // --- RECENTLY FULFILLED / RECALL (the Toast/Square "Recently
        // Fulfilled" pattern): tickets bumped to 'ready' or 'completed' in
        // the last 60 minutes stay reachable in a hidden panel so an
        // accidental bump can be undone. Recall sends ONE order_update
        // PATCH — status back to 'paid' AND every item's state cleared.
        // Clearing the states is what makes the ticket count again in the
        // Total Pendiente (all-day) strip, which skips 'ready' items.
        let recientesOpen = false;
        function kdsParseDate(dateStr) {
            if (!dateStr) return new Date();
            let fixedStr = String(dateStr).replace(' ', 'T');
            if (!fixedStr.includes('Z') && !fixedStr.includes('+')) fixedStr += 'Z';
            return new Date(fixedStr);
        }
        function recentlyFulfilledList() {
            const now = new Date();
            return orders.filter(o => {
                if (!['ready', 'completed'].includes(o.status)) return false;
                const t = kdsParseDate(o.completed_at || o.created_at);
                if (now - t > 60 * 60000) return false;
                const items = o.items || [];
                if (!items.length) return true;
                return items.some(i => currentMode === 'drinks' ? isDrinkItem(i) : isFoodItem(i));
            }).sort((a, b) => kdsParseDate(b.completed_at || b.created_at) - kdsParseDate(a.completed_at || a.created_at)).slice(0, 8);
        }
        function toggleRecientes() {
            recientesOpen = !recientesOpen;
            document.getElementById('recientes-panel').classList.toggle('hidden', !recientesOpen);
            if (recientesOpen) renderRecientes();
        }
        function renderRecientes() {
            const list = recentlyFulfilledList();
            const badge = document.getElementById('recientes-count');
            if (badge) badge.innerText = list.length ? '(' + list.length + ')' : '';
            if (!recientesOpen) return;
            const panel = document.getElementById('recientes-panel');
            if (!list.length) {
                panel.innerHTML = '<p class="text-[10px] font-black uppercase tracking-widest text-white/30">Sin completadas en la última hora</p>';
                return;
            }
            panel.innerHTML = '<p class="text-[10px] font-black uppercase tracking-widest text-emerald-400/70">Completadas recientes — Reactivar devuelve la orden a la pantalla</p>' + list.map(o => {
                const name = o.customers?.name || o.notes?.match(/Mobile:\s*([^(]+)/)?.[1] || 'Invitado';
                const when = kdsParseDate(o.completed_at || o.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const brief = (o.items || []).slice(0, 3).map(i => (i.qty || 1) + 'x ' + i.name).join(' · ');
                return `<div class="flex items-center gap-3 bg-white/5 border-l-4 border-emerald-500 rounded-xl px-4 py-3">
                    <div class="flex-1 min-w-0">
                        <p class="font-black text-sm text-white/90">#${escHtml(o.order_number || '')} · ${escHtml(name)} <span class="text-white/30 font-bold text-[10px] uppercase">${o.status === 'ready' ? 'Listo' : 'Completada'} ${when}</span></p>
                        <p class="text-[11px] text-white/40 truncate">${escHtml(brief)}</p>
                    </div>
                    <button onclick="recallOrder('${o.id}')" class="shrink-0 px-4 py-2 rounded-full bg-emerald-500 text-dark text-[10px] font-black uppercase active:scale-95 transition-all">Reactivar</button>
                </div>`;
            }).join('');
        }
        window.recallOrder = async function(id) {
            const o = orders.find(x => String(x.id) === String(id));
            if (!o) return;
            const items = (o.items || []).map(i => ({ ...i, status: null, stations: null }));
            try {
                const res = await fetch('/api/orders/' + id, { method: 'PATCH', headers: staffHeaders(), body: JSON.stringify({ status: 'paid', items }) });
                if (res.status === 401) { alert("Sesión expirada. Ingresa tu PIN de nuevo."); relogin(); return; }
                fetchOrders();
            } catch (e) { alert("Error al reactivar"); }
        };

        async function updateOrderStatus(id, status) {
            const res = await fetch('/api/orders/' + id, { method: 'PATCH', headers: staffHeaders(), body: JSON.stringify({ status }) });
            if (res.status === 401) { alert("Sesión expirada. Ingresa tu PIN de nuevo."); relogin(); return; }
            fetchOrders();
        }

        function logout() { localStorage.removeItem('ra_staff_pin'); location.reload(); }

        // --- BUILD CARD (receta por ticket) ---
        // Tapping the ticket BODY (not its buttons, not its item rows —
        // those keep LISTO / item-state behavior) opens the build card:
        // the item's steps with their tied ingredients, quantities already
        // adjusted by the ticket's chosen modifiers via the delta table.
        // Data: ONE staff-gated read (action=kds_recipe_data), cached here
        // for a minute; refetched on open when stale.
        const recipeCache = {}; // itemId -> { data|null, at }
        const RECIPE_TTL_MS = 60000;

        async function fetchRecipeData(ids) {
            const need = [...new Set(ids)].filter(id => {
                const c = recipeCache[id];
                return !c || (Date.now() - c.at > RECIPE_TTL_MS);
            });
            if (!need.length) return true;
            try {
                const res = await fetch('/api/store?action=kds_recipe_data&ids=' + encodeURIComponent(need.join(',')), { headers: staffHeaders() });
                if (res.status === 401) { alert("Sesión expirada. Ingresa tu PIN de nuevo."); relogin(); return false; }
                const data = await res.json();
                const items = (data && data.items) || {};
                need.forEach(id => { recipeCache[id] = { data: items[id] || null, at: Date.now() }; });
                return true;
            } catch (e) { console.error(e); return false; }
        }

        function cardBodyClick(e, orderId) {
            // A tap that landed on a button or inside any element carrying
            // its own onclick (the item rows cycle state) is NOT a body tap.
            let el = e.target;
            while (el && el !== e.currentTarget) {
                if (el.tagName === 'BUTTON' || el.hasAttribute('onclick')) return;
                el = el.parentElement;
            }
            openBuildCard(orderId);
        }

        async function openBuildCard(orderId) {
            const o = orders.find(x => String(x.id) === String(orderId));
            if (!o) return;
            const overlay = document.getElementById('build-card-overlay');
            const body = document.getElementById('build-card-body');
            document.getElementById('build-card-title').innerText = 'Receta #' + (o.order_number || '---');
            overlay.classList.remove('hidden');
            body.innerHTML = '<p class="text-center text-white/40 py-10 font-bold uppercase text-xs tracking-widest"><i class="fas fa-spinner fa-spin mr-2"></i>Cargando receta...</p>';
            const ids = (o.items || []).map(i => i.id).filter(Boolean);
            const ok = await fetchRecipeData(ids);
            if (!ok) {
                body.innerHTML = '<p class="text-center text-red-400 py-10 font-bold uppercase text-xs tracking-widest">No se pudo cargar la receta</p>';
                return;
            }
            body.innerHTML = (o.items || []).map(i => buildItemHtml(i)).join('') || '<p class="text-white/40 text-sm">Sin artículos.</p>';
        }

        function closeBuildCard() {
            document.getElementById('build-card-overlay').classList.add('hidden');
        }

        function buildItemHtml(item) {
            const entry = recipeCache[item.id];
            const data = entry && entry.data;
            const qty = parseInt(item.qty) > 0 ? parseInt(item.qty) : 1;
            let inner = '';
            if (!data || (((!data.lines || !data.lines.length) && (!data.steps || !data.steps.length)))) {
                inner = '<p class="text-[11px] font-bold text-amber-400/80 uppercase tracking-widest">Sin receta cargada</p>';
            } else {
                const adj = adjustRecipeLines(data.lines || [], data.options || [], data.deltas || [], item.mods || [], qty);
                const steps = data.steps || [];
                const byStep = {};
                const baseLines = [];
                adj.forEach(l => {
                    if (l.step_no && l.step_no >= 1 && l.step_no <= steps.length) (byStep[l.step_no] = byStep[l.step_no] || []).push(l);
                    else baseLines.push(l);
                });
                const lineTxt = (l) => `${escHtml(l.name)} ${fmtBuildQty(l.qty)} ${escHtml(l.unit)}`;
                let blocks = '';
                steps.forEach((s, ix) => {
                    const n = ix + 1;
                    const ings = (byStep[n] || []).map(lineTxt).join(' · ');
                    blocks += `<div class="p-3 rounded-xl bg-white/5 border border-white/5">
                        <p class="text-xs leading-relaxed"><span class="font-black text-gold uppercase">Paso ${n}</span>${ings ? ` — <span class="font-bold text-white/90">${ings}</span>` : ''}${s ? ` <span class="text-white/50">· ${escHtml(s)}</span>` : ''}</p>
                    </div>`;
                });
                if (baseLines.length) {
                    blocks += `<div class="p-3 rounded-xl bg-white/5 border border-white/5">
                        <p class="text-xs leading-relaxed"><span class="font-black text-gold uppercase">Base</span> — <span class="font-bold text-white/90">${baseLines.map(lineTxt).join(' · ')}</span></p>
                    </div>`;
                }
                if (!adj.length) {
                    inner = '<p class="text-[11px] text-white/40">Sin ingredientes cargados.</p>';
                } else {
                    const totals = adj.map(l => `<span class="px-2 py-1 rounded-lg bg-black/30 border border-white/10 text-[10px] font-bold">${lineTxt(l)}</span>`).join(' ');
                    inner = `<div class="space-y-2">${blocks}</div>
                        <p class="text-[9px] font-black uppercase tracking-widest text-white/30 mt-3 mb-1">Totales ×${qty}</p>
                        <div class="flex flex-wrap gap-1.5">${totals}</div>`;
                }
            }
            return `<div class="border-b border-white/5 pb-4 mb-4 last:border-0 last:mb-0 last:pb-0">
                <p class="font-black text-sm uppercase text-white/90">${qty}x ${escHtml(item.name)}</p>
                ${modsHtml(item)}
                <div class="mt-2">${inner}</div>
            </div>`;
        }

        // === BUILD-CARD-MATH-BEGIN ===
        // Pure recipe math for the build card (the computation harness
        // extracts exactly this block — keep it free of DOM/fetch calls).
        // Count units scale with a countable option's chosen qty (Splenda
        // sobres); bulk units (ml, g) apply flat per serving — that is how
        // the seed encodes swap-aways vs countable add-ins.
        const BUILD_COUNT_UNITS = ['sobre', 'sobres', 'pieza', 'piezas', 'unidad', 'unidades', 'unit', 'units', 'pc', 'pcs'];
        function buildModQty(mod, opt) {
            const q = parseInt(mod && mod.qty);
            if (Number.isInteger(q) && q > 0) return Math.min(q, 8);
            if (opt && opt.allow_qty && opt.default_qty) return opt.default_qty;
            return 1;
        }
        function resolveBuildOption(options, mod) {
            if (!mod) return null;
            const pool = options || [];
            const modId = mod.id || mod.option_id || mod.optionId || null;
            if (modId) { const byId = pool.find(o => o.id === modId); if (byId) return byId; }
            const modName = String(mod.name || '').trim().toLowerCase();
            if (!modName) return null;
            const named = pool.filter(o => String(o.name || '').trim().toLowerCase() === modName);
            if (named.length <= 1) return named[0] || null;
            const g = String(mod.group || '').trim().toLowerCase();
            return named.find(o => String(o.group || '').trim().toLowerCase() === g) || named[0];
        }
        // baseLines/options/deltas come from action=kds_recipe_data; mods
        // are the ticket item's chosen modifiers (POS snapshot shape).
        // Returns adjusted totals for the whole ticket line (x item qty).
        function adjustRecipeLines(baseLines, options, deltas, mods, itemQty) {
            // Deltas ADJUST a recipe; with no base lines there is nothing
            // to build from (the card renders "Sin receta cargada").
            if (!baseLines || !baseLines.length) return [];
            const lines = baseLines.map(l => ({ slug: l.slug, name: l.name, unit: l.unit, qty: parseFloat(l.qty) || 0, step_no: (l.step_no === undefined ? null : l.step_no) }));
            const findLine = (slug, unit) => lines.find(l => l.slug === slug && l.unit === unit);
            (mods || []).forEach(mod => {
                const opt = resolveBuildOption(options, mod);
                if (!opt) return;
                const rows = (deltas || []).filter(d => d.option_id === opt.id);
                if (!rows.length) return;
                const chosen = buildModQty(mod, opt);
                // Negatives first: a line this option swaps AWAY lends its
                // step to the line the same option swaps IN (leche entera
                // -> avena renders on the milk step, not under Base).
                let removedStep = null;
                const ordered = [...rows.filter(r => (parseFloat(r.qty_delta) || 0) < 0), ...rows.filter(r => (parseFloat(r.qty_delta) || 0) >= 0)];
                ordered.forEach(d => {
                    const dQty = parseFloat(d.qty_delta) || 0;
                    const factor = (opt.allow_qty && BUILD_COUNT_UNITS.includes(String(d.unit || '').toLowerCase())) ? chosen : 1;
                    const eff = dQty * factor;
                    const ex = findLine(d.slug, d.unit);
                    if (ex) {
                        ex.qty += eff;
                        if (eff < 0 && ex.qty <= 0.0001 && removedStep === null) removedStep = ex.step_no;
                    } else if (eff > 0) {
                        lines.push({ slug: d.slug, name: d.name || d.slug, unit: d.unit, qty: eff, step_no: removedStep });
                    }
                });
            });
            const mult = parseInt(itemQty) > 0 ? parseInt(itemQty) : 1;
            return lines
                .filter(l => l.qty > 0.0001)
                .map(l => ({ ...l, qty: Math.round(l.qty * mult * 100) / 100 }));
        }
        function fmtBuildQty(q) {
            const n = Math.round((parseFloat(q) || 0) * 100) / 100;
            return Number.isInteger(n) ? String(n) : String(n).replace(/\.?0+$/, '');
        }
        // === BUILD-CARD-MATH-END ===
    </script>
    <script src="/quimi-nav.js"></script>
</body>
